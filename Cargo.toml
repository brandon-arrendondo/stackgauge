[package]
name = "stackgauge"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Brandon Arrendondo <brandon@arrendondo.dev>"]
description = "Static stack depth analysis for embedded system map files"

[[bin]]
name = "stackgauge"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.4"
colored = "2.0"
regex = "1.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
