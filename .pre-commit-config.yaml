default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

# Pre-commit hooks for stackgauge
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (auto-fix)
        description: Format Rust code with rustfmt
        entry: bash -c 'cargo fmt --all 2>&1 && echo "Formatting complete"'
        language: system
        pass_filenames: false
        types: [rust]
        verbose: true

      - id: cargo-clippy
        name: cargo clippy
        description: Lint Rust code with Clippy - deny warnings (all targets including tests)
        entry: bash -c 'cargo clippy --all-targets -- -D warnings 2>&1'
        language: system
        pass_filenames: false
        types: [rust]
        verbose: true

      - id: cargo-test
        name: cargo test
        description: Run the test suite
        entry: bash -c 'cargo test --all-targets 2>&1'
        language: system
        pass_filenames: false
        types: [rust]
        verbose: true

      - id: commit-message-policy
        name: DCO sign-off and no AI attribution trailers
        entry: python3 scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
      - id: agent-guard-tests
        name: agent and commit guard regression tests
        entry: python3 -W error::ResourceWarning -m unittest discover -s scripts -p test_check_*.py
        language: system
        pass_filenames: false
        files: ^scripts/(check_|test_check_).*\.py$
