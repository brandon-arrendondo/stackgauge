name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt + clippy + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Security audit
        run: |
          cargo install cargo-audit
          cargo audit

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  build:
    name: Build (Linux release)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Verify binary
        run: target/release/stackgauge --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: stackgauge-linux-x86_64
          path: target/release/stackgauge

  windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Windows release binary
        run: cargo build --release

      - name: Verify binary
        run: target\release\stackgauge.exe --version
        shell: cmd

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\stackgauge.exe -Destination dist\
          Copy-Item README.md -Destination dist\ -ErrorAction SilentlyContinue
          Copy-Item LICENSE -Destination dist\ -ErrorAction SilentlyContinue
          Copy-Item stackgauge.toml -Destination dist\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\* -DestinationPath stackgauge-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: stackgauge-windows-x86_64
          path: stackgauge-windows-x86_64.zip
